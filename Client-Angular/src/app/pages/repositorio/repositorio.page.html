@switch (state) {
  @case ('loading') {
    <app-alert alertState="loading" text="Cargando repositorios..."></app-alert>
  }
  @case ('error') {
    <app-alert alertState="error" text="Error al cargar los repositorios"></app-alert>
  }
  @case ('success') {
    <app-repositorio-table [repositorios]="repositorios"></app-repositorio-table>
  }
}
