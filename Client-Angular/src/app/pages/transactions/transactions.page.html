@switch (state) {
  @case ('loading') {
    <app-alert alertState="loading" text="Cargando Transacciones..."></app-alert>
  }
  @case ('error') {
    <app-alert alertState="error" text="Error al Cargar las Transacciones"></app-alert>
  }
  @case ('success') {
    <app-transactions-table [transactions]="transactions"></app-transactions-table>
  }
}
